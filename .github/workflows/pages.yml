name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp index.html _site/
          cp -r static _site/static
          mkdir -p _site/data
          cp -r data/quotes _site/data/quotes
          cp -r data/market_news _site/data/market_news
          cp -f data/jp.json data/us.json _site/data/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
