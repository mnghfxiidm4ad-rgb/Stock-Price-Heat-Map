name: Update closing prices

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Which market to refresh"
        type: choice
        options:
          - jp
          - us
          - both
        default: both
  schedule:
    # 日本株: 東証は 15:00 JST 引け。Yahoo に終値が乗る 17:00 JST と予備の 19:00 JST
    - cron: "0 8 * * 1-5"
    - cron: "0 10 * * 1-5"
    # 米株: 16:00 ET 引け。夏時間は 21:30 UTC、冬時間は 23:00 UTC 以降
    - cron: "30 21 * * 1-5"
    - cron: "0 23 * * 1-5"

concurrency:
  group: update-quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Install
        run: python -m pip install -r requirements-update.txt

      - name: Select market
        id: sel
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MARKET: ${{ github.event.inputs.market }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "market=${INPUT_MARKET:-both}" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 8 * * 1-5" ] || [ "$SCHEDULE" = "0 10 * * 1-5" ]; then
            echo "market=jp" >> "$GITHUB_OUTPUT"
          else
            echo "market=us" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch closes
        run: python scripts/update_quotes.py --market ${{ steps.sel.outputs.market }} --batch-size 40 --sleep 2.0

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data lists
          if git diff --cached --quiet; then
            echo "No quote changes"
          else
            git commit -m "Update ${{ steps.sel.outputs.market }} closing prices"
            git pull --rebase origin main
            git push
          fi
