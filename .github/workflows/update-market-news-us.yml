name: Update US market news

on:
  workflow_dispatch:
  schedule:
    # 米株クローズ後 06:30 JST = 21:30 UTC（月〜金 UTC = 火〜土 JST）
    - cron: "30 21 * * 1-5"
    # 夏時間の 05:30 JST = 20:30 UTC
    - cron: "30 20 * * 1-5"

concurrency:
  group: update-market-news-us
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Install
        run: python -m pip install -r requirements-update.txt

      - name: Collect US daily news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python collect_market_news.py --market us --daily

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_news
          if git diff --cached --quiet; then
            echo "No news changes"
          else
            git commit -m "Update US market news"
            git pull --rebase origin main
            git push
          fi
